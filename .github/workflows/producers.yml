name: Build Producers (aarch64)

# Rebuilds the patched compositor + Xwayland packages for every supported
# distro target as native aarch64 builds, and publishes one artifact per
# matrix leg (.deb/.ddeb, .rpm, or pacman packages).
#
# The runners are GitHub's free arm64 hosted runners (ubuntu-24.04-arm),
# available for public repositories.

on:
  push:
    branches: [ '**' ]
    paths:
      - 'producers/**'
      - 'common/**'
      - 'libdisplay_producer/**'
      - '.github/workflows/producers.yml'
  pull_request:
    paths:
      - 'producers/**'
      - 'common/**'
      - 'libdisplay_producer/**'
      - '.github/workflows/producers.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Producer target to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - kwin-kde-neon
          - kwin-ubuntu-2604
          - kwin-debian-13
          - kwin-fedora-43
          - kwin-arch-arm
          - mutter-ubuntu-2604
          - mutter-debian-13
  workflow_call:

permissions:
  contents: read

concurrency:
  group: producers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve build targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          ALL_TARGETS='[
            {"name":"kwin-kde-neon","image":"ubuntu:24.04","family":"deb","script":"producers/kde/neon_v5/build.sh"},
            {"name":"kwin-ubuntu-2604","image":"ubuntu:26.04","family":"deb","script":"producers/kde/ubuntu2604_v5/build.sh"},
            {"name":"kwin-debian-13","image":"debian:13","family":"deb","script":"producers/kde/Debian13_v5/build.sh"},
            {"name":"kwin-fedora-43","image":"fedora:43","family":"rpm","script":"producers/kde/Fedora43_v5/build.sh"},
            {"name":"kwin-arch-arm","image":"lfdevs/archlinuxarm:base-devel","family":"pacman","script":"producers/kde/Arch_v5/build.sh"},
            {"name":"mutter-ubuntu-2604","image":"ubuntu:26.04","family":"deb","script":"producers/gnome/Ubuntu2604_v5/build.sh"},
            {"name":"mutter-debian-13","image":"debian:13","family":"deb","script":"producers/gnome/Debian13_v5/build.sh"}
          ]'
          TARGET="${{ inputs.target || 'all' }}"
          if [ "$TARGET" = "all" ] || [ -z "$TARGET" ]; then
            SELECTED="$ALL_TARGETS"
          else
            SELECTED="$(echo "$ALL_TARGETS" | jq -c "[.[] | select(.name == \"$TARGET\")]")"
          fi
          echo "matrix={\"include\":$SELECTED}" >> $GITHUB_OUTPUT

  build:
    needs: setup
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dpkg-buildpackage and apt-get source are not in minimal Debian/Ubuntu images.
      - name: Bootstrap build tools (deb)
        if: matrix.family == 'deb'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
              build-essential devscripts fakeroot patch git ca-certificates curl gnupg

      # makepkg refuses to run as root: build as an unprivileged user with passwordless sudo.
      - name: Bootstrap build tools (pacman)
        if: matrix.family == 'pacman'
        run: |
          pacman -Syyu --noconfirm base-devel sudo git
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build packages
        if: matrix.family != 'pacman'
        env:
          WORKDIR: ${{ github.workspace }}/out
        run: bash ${{ matrix.script }}

      - name: Build packages (pacman)
        if: matrix.family == 'pacman'
        env:
          WORKDIR: ${{ github.workspace }}/out
        run: |
          su builder -s /bin/bash -c \
            "cd '$GITHUB_WORKSPACE' && WORKDIR='$WORKDIR' INSTALL=0 bash '${{ matrix.script }}'"

      - name: Collect packages
        run: |
          mkdir -p dist
          find "$GITHUB_WORKSPACE/out" -type f \( \
              -name '*.deb' -o -name '*.ddeb' -o \
              \( -name '*.rpm' ! -name '*.src.rpm' \) -o \
              -name '*.pkg.tar.*' \) -print -exec cp -t dist/ {} +
          ls -lh dist/
          [ -n "$(ls -A dist)" ] || { echo '::error::no packages were produced'; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: anland-${{ matrix.name }}-aarch64
          path: dist/
          if-no-files-found: error
